<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>EARNOS — Earn Something Real</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070910;
  --bg2:#0b0d16;
  --card:#111522;
  --card2:#151927;
  --line:#242838;
  --text:#f5f5fa;
  --muted:#8d93a6;
  --purple:#8b4dff;
  --purple2:#a66cff;
  --green:#57d9b0;
  --red:#ff5578;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  background:
    radial-gradient(circle at 100% 10%,rgba(125,67,255,.13),transparent 28%),
    radial-gradient(circle at 0% 40%,rgba(70,50,160,.07),transparent 30%),
    var(--bg);
}

header{
  height:92px;
  padding:20px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,9,16,.88);
  backdrop-filter:blur(20px);
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1.8px;
}
.logo span{color:var(--purple2)}

.head-actions{display:flex;gap:12px;align-items:center}

.icon-btn,.avatar-btn{
  width:54px;height:54px;border-radius:18px;
  border:1px solid var(--line);
  background:#11141f;color:white;
  display:grid;place-items:center;
}
.icon-btn{font-size:23px}
.avatar-btn{
  font-size:17px;font-weight:700;
  background:linear-gradient(135deg,#a269ff,#6725ed);
  border:0;
}

main{padding:30px 30px 120px}

.status{
  border:1px solid var(--line);
  background:rgba(18,21,32,.8);
  border-radius:22px;
  padding:14px 18px;
  color:var(--muted);
  display:flex;align-items:center;gap:10px;
  margin-bottom:38px;
}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px rgba(87,217,176,.7);
}
.status.error .status-dot{background:var(--red);box-shadow:none}

.eyebrow{
  color:#9da3b5;
  letter-spacing:3px;
  font-size:14px;
  font-weight:600;
  margin-bottom:12px;
}
h1{
  margin:0;
  font-size:50px;
  line-height:1.02;
  letter-spacing:-2.5px;
}
.gradient{color:var(--purple2)}
.subtitle{
  margin-top:20px;
  color:#9399ab;
  font-size:20px;
  line-height:1.55;
}

.balance-card{
  margin-top:36px;
  padding:34px 30px;
  min-height:310px;
  border-radius:34px;
  border:1px solid #2a2e40;
  background:
    radial-gradient(circle at 90% 20%,rgba(145,82,255,.25),transparent 25%),
    radial-gradient(circle at 90% 100%,rgba(110,66,255,.08),transparent 35%),
    linear-gradient(145deg,#151925,#10131d);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}
.balance-card:after{
  content:"";
  position:absolute;
  width:300px;height:300px;
  right:-100px;bottom:-170px;
  border:1px solid rgba(160,110,255,.14);
  border-radius:50%;
  box-shadow:0 0 0 45px rgba(160,110,255,.035),0 0 0 90px rgba(160,110,255,.025);
}
.small-label{color:#9ca2b3;font-size:17px}
.balance{
  font-size:68px;
  line-height:1;
  font-weight:800;
  letter-spacing:-3px;
  margin:12px 0 28px;
}
.balance-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;
}
.pill{
  display:inline-flex;
  padding:10px 15px;
  border-radius:30px;
  background:rgba(36,43,54,.8);
  color:#c6cad5;
  font-weight:600;
}
.green-pill{background:rgba(24,104,87,.32);color:var(--green)}
.progress-title{
  display:flex;justify-content:space-between;
  color:#9ba1b2;
  margin-top:34px;margin-bottom:10px;
}
.progress{
  height:9px;background:#202432;border-radius:10px;overflow:hidden;
}
.progress div{
  height:100%;width:0%;
  background:linear-gradient(90deg,#7c43ff,#b17aff);
  border-radius:10px;
  transition:.4s;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:28px;
}
.stat{
  border:1px solid var(--line);
  border-radius:27px;
  padding:24px;
  min-height:170px;
  background:linear-gradient(145deg,#111520,#0d1019);
}
.stat-top{display:flex;justify-content:space-between}
.stat-icon{
  width:48px;height:48px;border-radius:16px;
  background:rgba(113,55,225,.2);
  display:grid;place-items:center;color:#ad78ff;
}
.stat-title{color:#9298a9;font-size:17px}
.stat-value{font-size:30px;font-weight:700;margin-top:30px}

.section{margin-top:44px}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.section h2{
  font-size:27px;
  margin:0;
  letter-spacing:-1px;
}
.link-btn{
  background:none;border:0;color:#a66cff;font-weight:700;
}

.task-card{
  border:1px solid var(--line);
  border-radius:25px;
  padding:20px;
  background:#10131d;
  margin-bottom:14px;
}
.task-head{display:flex;justify-content:space-between;gap:15px}
.task-title{font-size:18px;font-weight:700}
.task-desc{color:#8e95a7;margin-top:7px;line-height:1.4}
.reward{
  color:#67dfb8;
  font-weight:800;
  white-space:nowrap;
}
.task-footer{
  margin-top:18px;
  display:flex;justify-content:space-between;align-items:center;
}
.tag{
  border:1px solid #303548;
  border-radius:30px;
  padding:7px 12px;
  color:#9da4b6;
  font-size:13px;
}
.primary{
  border:0;
  border-radius:14px;
  padding:12px 20px;
  color:white;
  font-weight:700;
  background:linear-gradient(135deg,#9b5aff,#6d2eea);
  box-shadow:0 8px 25px rgba(125,55,240,.2);
}
.primary:disabled{opacity:.45;cursor:not-allowed}

.page-title{font-size:48px;letter-spacing:-2px;margin:0 0 14px}
.page-desc{font-size:19px;color:#9198aa;line-height:1.55;margin-bottom:28px}

.filters{
  display:flex;gap:10px;overflow:auto;padding-bottom:6px;
  margin-bottom:22px;
}
.filter{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#11141e;
  color:#9299aa;
  border-radius:30px;
  padding:12px 18px;
}
.filter.active{
  color:#b787ff;
  border-color:#7040bd;
  background:rgba(115,59,220,.16);
}

.empty{
  border:1px dashed #303546;
  border-radius:28px;
  min-height:270px;
  display:grid;
  place-items:center;
  text-align:center;
  padding:35px;
  color:#8d94a7;
}
.empty strong{display:block;color:#eeeef4;font-size:20px;margin-bottom:10px}

.wallet-card{
  border:1px solid var(--line);
  border-radius:32px;
  padding:30px;
  background:linear-gradient(145deg,#151925,#10131c);
}
.wallet-balance{font-size:60px;font-weight:800;letter-spacing:-3px;margin:8px 0 28px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.secondary{
  border:1px solid #303548;
  background:#1b1f2c;
  color:#f3f3f6;
  border-radius:16px;
  padding:15px;
  font-weight:700;
}
.note{color:#7f879a;font-size:14px;line-height:1.5;margin-top:18px}

.rows{
  margin-top:20px;
  border:1px solid var(--line);
  border-radius:25px;
  overflow:hidden;
}
.row{
  display:flex;justify-content:space-between;
  padding:20px 24px;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row span:first-child{color:#9097a8}
.row span:last-child{font-weight:700}

.profile-card{
  border:1px solid var(--line);
  border-radius:34px;
  padding:40px 25px;
  text-align:center;
  background:linear-gradient(145deg,#151925,#10131c);
}
.big-avatar{
  width:135px;height:135px;margin:auto;
  border-radius:38px;
  display:grid;place-items:center;
  font-size:48px;font-weight:800;
  background:linear-gradient(135deg,#a86cff,#6527e8);
  box-shadow:0 20px 50px rgba(114,47,245,.3);
}
.profile-name{font-size:30px;font-weight:800;margin-top:24px}
.profile-user{color:#858c9f;margin-top:4px}
.profile-pills{display:flex;justify-content:center;gap:10px;margin-top:20px}

.login-box{
  max-width:470px;margin:50px auto;
  border:1px solid var(--line);
  border-radius:30px;
  padding:30px;
  background:#111520;
}
.input{
  width:100%;
  padding:16px;
  margin-top:12px;
  border-radius:15px;
  border:1px solid #2d3343;
  background:#090c13;
  color:white;
  outline:none;
}
.input:focus{border-color:#7b45dc}
.form-btn{width:100%;margin-top:16px}
.form-switch{
  text-align:center;color:#8c93a5;margin-top:20px;
}
.form-switch button{
  border:0;background:none;color:#a56cff;
}

.bottom-nav{
  position:fixed;
  left:50%;bottom:0;
  transform:translateX(-50%);
  width:min(760px,100%);
  height:94px;
  background:rgba(7,9,15,.96);
  border-top:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(22px);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav{
  border:0;background:none;color:#687084;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:700;
}
.nav-icon{font-size:25px;line-height:1}
.nav.active{color:#a66cff}
.nav.active:before{
  content:"";
  position:absolute;
  top:-2px;width:40px;height:3px;
  border-radius:5px;background:#9659ff;
}

.toast{
  position:fixed;
  left:50%;bottom:110px;
  transform:translateX(-50%);
  width:min(90%,600px);
  background:#1b1f2b;
  border:1px solid #303647;
  color:#e9eaf0;
  padding:15px 18px;
  border-radius:17px;
  z-index:50;
  box-shadow:var(--shadow);
}

.spinner{
  width:22px;height:22px;border-radius:50%;
  border:3px solid #34394a;border-top-color:#a66cff;
  animation:spin .8s linear infinite;margin:auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:520px){
  header{padding:18px 22px;height:82px}
  main{padding:25px 22px 120px}
  h1,.page-title{font-size:43px}
  .balance{font-size:57px}
  .balance-card{padding:27px 22px}
  .stats{gap:12px}
  .stat{padding:18px;min-height:150px}
  .stat-value{font-size:26px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">EARN<span>OS.</span></div>
  <div class="head-actions">
    <button class="icon-btn" onclick="showToast('Notifications coming soon')">♧</button>
    <button class="avatar-btn" id="headerAvatar" onclick="navigate('profile')">EU</button>
  </div>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button class="nav active" data-page="home" onclick="navigate('home')">
    <span class="nav-icon">⌂</span><span>Home</span>
  </button>
  <button class="nav" data-page="tasks" onclick="navigate('tasks')">
    <span class="nav-icon">☑</span><span>Tasks</span>
  </button>
  <button class="nav" data-page="wallet" onclick="navigate('wallet')">
    <span class="nav-icon">▣</span><span>Wallet</span>
  </button>
  <button class="nav" data-page="profile" onclick="navigate('profile')">
    <span class="nav-icon">♙</span><span>Profile</span>
  </button>
</nav>

<div id="toast" class="toast hidden"></div>
</div>

<script>
/* =========================================================
   EARNOS SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL = "https://imiciluejhsoogykhowz.supabase.co";

/*
  এখানে তোমার Publishable key বসাবে।

  উদাহরণ:
  const SUPABASE_KEY = "sb_publishable_BgaaOwSY211P93ffLJyeqw_ZBTixIq8";

  SECRET / service_role KEY এখানে কখনো বসাবে না।
*/
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const hasSupabaseKey =
  SUPABASE_KEY &&
  SUPABASE_KEY !== "YOUR_PUBLISHABLE_KEY";

const supabaseClient =
  hasSupabaseKey
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;


/* =========================================================
   STATE
   ========================================================= */

let state = {
  user:null,
  profile:null,
  tasks:[],
  submissions:[],
  transactions:[],
  withdrawals:[],
  referrals:[],
  loading:false,
  category:"All"
};


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id => document.getElementById(id);

function money(value){
  return "$" + Number(value || 0).toFixed(2);
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(message,error=false){
  const t=$("toast");
  t.textContent=message;
  t.classList.remove("hidden");
  t.style.borderColor=error ? "#693044" : "#303647";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.add("hidden"),3500);
}

function setStatus(message,error=false){
  const old=document.querySelector(".status");
  if(!old)return;
  old.classList.toggle("error",error);
  old.innerHTML=
    `<span class="status-dot"></span>${escapeHTML(message)}`;
}

function navUpdate(page){
  document.querySelectorAll(".nav").forEach(n=>{
    n.classList.toggle("active",n.dataset.page===page);
  });
}


/* =========================================================
   AUTH
   ========================================================= */

async function getSession(){
  if(!supabaseClient)return null;

  const {data,error}=await supabaseClient.auth.getSession();

  if(error){
    console.error(error);
    return null;
  }

  return data.session;
}

async function loadUser(){
  if(!supabaseClient)return;

  const session=await getSession();
  state.user=session?.user || null;

  if(state.user){
    await loadProfile();
  }
}

async function loadProfile(){
  if(!state.user || !supabaseClient)return;

  const {data,error}=await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error){
    console.error("Profile:",error);
    return;
  }

  state.profile=data;
  updateAvatar();
}

async function signIn(email,password){
  if(!supabaseClient){
    showToast("Publishable key এখনো বসানো হয়নি",true);
    return;
  }

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,password
  });

  if(error){
    showToast(error.message,true);
    return;
  }

  await loadUser();
  showToast("Welcome back!");
  navigate("home");
}

async function signUp(email,password,name){
  if(!supabaseClient){
    showToast("Publishable key এখনো বসানো হয়নি",true);
    return;
  }

  const {data,error}=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      data:{
        name:name || "EARNOS User"
      }
    }
  });

  if(error){
    showToast(error.message,true);
    return;
  }

  if(data.session){
    await loadUser();
    navigate("home");
    showToast("Account created successfully!");
  }else{
    showToast("Account created. Check your email to verify.");
  }
}

async function signOut(){
  if(supabaseClient){
    await supabaseClient.auth.signOut();
  }

  state.user=null;
  state.profile=null;
  state.tasks=[];
  showToast("Signed out");
  navigate("home");
}

async function requireAuth(){
  if(!state.user){
    navigate("login");
    return false;
  }
  return true;
}


/* =========================================================
   DATABASE
   ========================================================= */

async function loadTasks(){
  if(!supabaseClient)return;

  const {data,error}=await supabaseClient
    .from("tasks")
    .select("*")
    .eq("status","active")
    .order("created_at",{ascending:false});

  if(error){
    console.error("Tasks:",error);
    state.tasks=[];
    return;
  }

  state.tasks=data || [];
}

async function loadSubmissions(){
  if(!supabaseClient || !state.user)return;

  const {data,error}=await supabaseClient
    .from("task_submissions")
    .select("*")
    .eq("user_id",state.user.id);

  if(error){
    console.error("Submissions:",error);
    return;
  }

  state.submissions=data || [];
}

async function loadTransactions(){
  if(!supabaseClient || !state.user)return;

  const {data,error}=await supabaseClient
    .from("transactions")
    .select("*")
    .eq("user_id",state.user.id)
    .order("created_at",{ascending:false});

  if(error){
    console.error("Transactions:",error);
    state.transactions=[];
    return;
  }

  state.transactions=data || [];
}

async function loadWithdrawals(){
  if(!supabaseClient || !state.user)return;

  const {data,error}=await supabaseClient
    .from("withdrawals")
    .select("*")
    .eq("user_id",state.user.id)
    .order("created_at",{ascending:false});

  if(error){
    console.error("Withdrawals:",error);
    state.withdrawals=[];
    return;
  }

  state.withdrawals=data || [];
}

async function loadReferrals(){
  if(!supabaseClient || !state.user)return;

  const {data,error}=await supabaseClient
    .from("referrals")
    .select("*")
    .or(`referrer_id.eq.${state.user.id},referred_user_id.eq.${state.user.id}`);

  if(error){
    console.error("Referrals:",error);
    state.referrals=[];
    return;
  }

  state.referrals=data || [];
}

async function refreshData(){
  state.loading=true;

  await loadUser();
  await loadTasks();

  if(state.user){
    await Promise.all([
      loadSubmissions(),
      loadTransactions(),
      loadWithdrawals(),
      loadReferrals()
    ]);
  }

  state.loading=false;
}


/* =========================================================
   CALCULATIONS
   ========================================================= */

function profileBalance(){
  return Number(
    state.profile?.balance ??
    state.profile?.pending_balance ??
    0
  );
}

function totalEarned(){
  return Number(state.profile?.total_earned || 0);
}

function tasksCompleted(){
  return Number(state.profile?.tasks_completed || 0);
}

function streak(){
  return Number(state.profile?.current_streak || 0);
}

function level(){
  return Number(state.profile?.level || 1);
}

function xp(){
  return Number(state.profile?.xp || 0);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

async function navigate(page){
  if(page==="home")renderHome();
  if(page==="tasks")renderTasks();
  if(page==="wallet")renderWallet();
  if(page==="profile")renderProfile();
  if(page==="login")renderLogin();
  if(page==="signup")renderSignup();

  navUpdate(page);
  window.scrollTo({top:0,behavior:"smooth"});
}


/* =========================================================
   HOME
   ========================================================= */

function renderHome(){

  const balance=profileBalance();
  const completed=tasksCompleted();

  $("app").innerHTML=`

    <div class="status ${hasSupabaseKey?"":"error"}">
      <span class="status-dot"></span>
      ${hasSupabaseKey
        ? (state.user ? "Connected to EARNOS backend" : "Backend connected — sign in to start earning")
        : "Add your Supabase Publishable key to connect"}
    </div>

    <section>
      <div class="eyebrow">WELCOME BACK</div>

      <h1>
        Let's earn<br>
        <span class="gradient">something real.</span>
      </h1>

      <div class="subtitle">
        Welcome to EARNOS. Verified tasks.<br>
        Clear rewards.
      </div>
    </section>

    <section class="balance-card">

      <div class="small-label">Available balance</div>

      <div class="balance">${money(balance)}</div>

      <div class="balance-row">
        <span class="pill green-pill">● ${money(balance)} today</span>
        <span class="pill">Level ${level()}</span>
      </div>

      <div class="progress-title">
        <span>Daily goal</span>
        <span>${Math.min(completed,100)}%</span>
      </div>

      <div class="progress">
        <div style="width:${Math.min(completed,100)}%"></div>
      </div>

    </section>

    <section class="stats">

      <div class="stat">
        <div class="stat-top">
          <div class="stat-title">Tasks<br>completed</div>
          <div class="stat-icon">✓</div>
        </div>
        <div class="stat-value">${completed}</div>
      </div>

      <div class="stat">
        <div class="stat-top">
          <div class="stat-title">Current streak</div>
          <div class="stat-icon">↗</div>
