<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#07090f"
  >

  <title>EARNOS — Earn Through Verified Opportunities</title>

  <!-- EARNOS CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="app">

    <!-- =========================
         HEADER
         ========================= -->

    <header class="header">

      <div class="logo">
        EARNOS<span>.</span>
      </div>

      <div class="header-actions">

        <button
          class="icon-btn"
          type="button"
          aria-label="Notifications"
        >
          ♧
        </button>

        <button
          class="avatar-btn"
          type="button"
          aria-label="Profile"
        >
          EU
        </button>

      </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main>

      <section class="page-title">

        <div class="eyebrow">
          Earn through verified opportunities
        </div>

        <h1>
          Welcome to EARNOS
        </h1>

      </section>


      <!-- Balance -->

      <section class="card balance-card">

        <div class="balance-label">
          Available balance
        </div>

        <div class="balance">
          <span class="currency">$</span><span
            class="amount"
            id="balance"
          >0.00</span>
        </div>

        <div class="status">
          Account connected
        </div>

      </section>


      <!-- Statistics -->

      <section class="stats-grid">

        <div class="card stat-card">

          <div class="stat-label">
            Tasks
          </div>

          <div
            class="stat-value"
            id="tasksCount"
          >
            0
          </div>

        </div>


        <div class="card stat-card">

          <div class="stat-label">
            Submissions
          </div>

          <div
            class="stat-value"
            id="submissionsCount"
          >
            0
          </div>

        </div>


        <div class="card stat-card">

          <div class="stat-label">
            Withdrawals
          </div>

          <div
            class="stat-value"
            id="withdrawalsCount"
          >
            0
          </div>

        </div>


        <div class="card stat-card">

          <div class="stat-label">
            Referrals
          </div>

          <div
            class="stat-value"
            id="referralsCount"
          >
            0
          </div>

        </div>

      </section>


      <!-- Opportunities -->

      <section class="section">

        <div class="section-head">

          <h2>
            Opportunities
          </h2>

          <a href="#" id="viewAll">
            View all
          </a>

        </div>


        <div
          class="card empty-state"
          id="opportunities"
        >

          <div class="empty-icon">
            ◇
          </div>

          <h3>
            No opportunities yet
          </h3>

          <p>
            Verified earning opportunities will appear here.
          </p>

        </div>

      </section>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
         ========================= -->

    <nav class="bottom-nav">

      <button
        class="nav-item active"
        type="button"
        data-page="home"
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>


      <button
        class="nav-item"
        type="button"
        data-page="tasks"
      >
        <span class="nav-icon">☑</span>
        <span>Tasks</span>
      </button>


      <button
        class="nav-item"
        type="button"
        data-page="wallet"
      >
        <span class="nav-icon">□</span>
        <span>Wallet</span>
      </button>


      <button
        class="nav-item"
        type="button"
        data-page="profile"
      >
        <span class="nav-icon">♙</span>
        <span>Profile</span>
      </button>

    </nav>


    <!-- Toast -->

    <div
      id="toast"
      class="toast"
      aria-live="polite"
    ></div>

  </div>


  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- EARNOS Configuration -->
  <script src="js/config.js"></script>

  <!-- EARNOS Application -->
  <script src="js/app.js"></script>

</body>
</html>
